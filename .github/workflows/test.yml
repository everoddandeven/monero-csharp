# Runs the unit tests and the integration tests, and tries the NuGet package, that Build made. It does not build anything: the tests are the ones
# that Build uploaded
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wait-build:
    name: Pending
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    outputs:
      run-id: ${{ steps.wait.outputs.run-id }}

    steps:
      - name: Wait for the Build run of this commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$SHA&event=$EVENT&per_page=1" --jq '.workflow_runs[0].id // empty' || true)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 20
          done
          if [ -z "$RUN_ID" ]; then echo "no Build run for $SHA"; exit 1; fi
          until [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .status || true)" = "completed" ]; do
            sleep 30
          done
          CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)
          if [ "$CONCLUSION" != "success" ]; then
            echo "Build run $RUN_ID concluded with $CONCLUSION"; exit 1
          fi
          MISSING=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '
            [.artifacts[] | select(.expired | not) | .name] as $available |
            ["monero-csharp-tests", "monero-csharp-integration-tests", "monero-csharp-nuget", "monero-native-nuget"] |
            map(select(. as $name | $available | index($name) == null)) | .[]')
          if [ -n "$MISSING" ]; then
            echo "Build run $RUN_ID is missing required artifacts:"
            echo "$MISSING"
            exit 1
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit tests
    needs: wait-build
    uses: ./.github/workflows/unit-tests.yml
    with:
      run-id: ${{ needs.wait-build.outputs.run-id }}

  integration:
    name: Integration tests
    needs: wait-build
    uses: ./.github/workflows/integration-tests.yml
    with:
      run-id: ${{ needs.wait-build.outputs.run-id }}

  package:
    name: NuGet package, ${{ matrix.platform }}
    needs: wait-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            os: ubuntu-24.04
          - platform: Windows x86_64
            os: windows-latest
          - platform: macOS arm64
            os: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download the NuGet package
        uses: actions/download-artifact@v8
        with:
          name: monero-csharp-nuget
          path: Monero.PackageTests/packages
          run-id: ${{ needs.wait-build.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Download the Monero.Native package
        uses: actions/download-artifact@v8
        with:
          name: monero-native-nuget
          path: native-packages
          run-id: ${{ needs.wait-build.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # a program that depends on the package, with nothing else to restore it from
      - name: Run the program that uses the package
        run: dotnet run --project Monero.PackageTests --configuration Release

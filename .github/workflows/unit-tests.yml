# Runs the unit tests that Build made, without building them again
name: Unit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wait-build:
    name: Build
    uses: ./.github/workflows/wait-build.yml
    with:
      artifacts: '["monero-csharp-tests"]'

  unit:
    name: ${{ matrix.platform }}
    needs: wait-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            os: ubuntu-24.04
          - platform: Linux arm64
            os: ubuntu-24.04-arm
          - platform: Windows x86_64
            os: windows-latest
          - platform: macOS arm64
            os: macos-15
          - platform: macOS x86_64
            os: macos-15-intel

    steps:
      - name: Download the unit tests
        uses: actions/download-artifact@v8
        with:
          name: monero-csharp-tests
          path: unit-tests
          run-id: ${{ needs.wait-build.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run the unit tests
        run: dotnet test unit-tests/Monero.UnitTests.dll --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results
          if-no-files-found: ignore

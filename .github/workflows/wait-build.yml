# Called by the test workflows. Waits for the Build run of the commit, and gives its id, once it succeeded and made the artifacts they need
name: Wait for Build

on:
  workflow_call:
    inputs:
      artifacts:
        description: JSON array with the names of the artifacts of Build that the caller needs
        required: true
        type: string
    outputs:
      run-id:
        description: the Build run of the commit
        value: ${{ jobs.wait.outputs.run-id }}

permissions:
  contents: read
  actions: read

jobs:
  wait:
    name: Pending
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    outputs:
      run-id: ${{ steps.wait.outputs.run-id }}

    steps:
      - name: Wait for the Build run of this commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          ARTIFACTS: ${{ inputs.artifacts }}
        run: |
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$SHA&event=$EVENT&per_page=1" --jq '.workflow_runs[0].id // empty' || true)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 20
          done
          if [ -z "$RUN_ID" ]; then echo "no Build run for $SHA"; exit 1; fi
          until [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .status || true)" = "completed" ]; do
            sleep 30
          done
          CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)
          if [ "$CONCLUSION" != "success" ]; then
            echo "Build run $RUN_ID concluded with $CONCLUSION"; exit 1
          fi
          MISSING=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" | jq -r --argjson wanted "$ARTIFACTS" '
            [.artifacts[] | select(.expired | not) | .name] as $available |
            $wanted | map(select(. as $name | $available | index($name) == null)) | .[]')
          if [ -n "$MISSING" ]; then
            echo "Build run $RUN_ID is missing required artifacts:"
            echo "$MISSING"
            exit 1
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

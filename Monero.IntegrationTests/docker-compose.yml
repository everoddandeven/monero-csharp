# Regtest network for the integration tests: two connected nodes.
#
#   docker compose -f Monero.IntegrationTests/docker-compose.yml up -d
#   dotnet test Monero.IntegrationTests
#   docker compose -f Monero.IntegrationTests/docker-compose.yml down -v
#
# node_2 is the daemon under test (127.0.0.1:18081) and node_1 is the one that mines (127.0.0.1:18089).
# The difficulty is fixed at 25: low enough to mine blocks quickly, and not 1, so that a template without a nonce is not a valid block.
services:

  node_1:
    image: lalanza808/monero:v0.18.5.1
    container_name: node_1
    command: [
      "monerod",
      "--fixed-difficulty=25",
      "--log-level=3",
      "--p2p-bind-ip=0.0.0.0",
      "--p2p-bind-port=48080",
      "--rpc-bind-port=18089",
      "--rpc-bind-ip=0.0.0.0",
      "--rpc-access-control-origins=*",
      "--rpc-ssl=disabled",
      "--rpc-login=rpc_daemon_user:abc123",
      "--rpc-max-connections-per-private-ip=100",
      "--disable-rpc-ban",
      "--confirm-external-bind",
      "--add-exclusive-node=node_2:18080",
      "--regtest",
      "--hide-my-port",
      "--no-zmq",
      "--max-connections-per-ip=100",
      "--non-interactive"
    ]
    volumes:
      - xmr_node_1_data:/data
    ports:
      - "48080:48080"
      - "18089:18089"
    restart: on-failure

  node_2:
    image: lalanza808/monero:v0.18.5.1
    container_name: node_2
    command: [
      "monerod",
      "--fixed-difficulty=25",
      "--log-level=3",
      "--p2p-bind-ip=0.0.0.0",
      "--p2p-bind-port=18080",
      "--rpc-bind-ip=0.0.0.0",
      "--rpc-bind-port=18081",
      "--rpc-access-control-origins=*",
      "--rpc-ssl=disabled",
      "--rpc-max-connections-per-private-ip=100",
      "--rpc-login=rpc_daemon_user:abc123",
      "--zmq-rpc-bind-ip=0.0.0.0",
      "--zmq-rpc-bind-port=18085",
      "--zmq-pub=tcp://0.0.0.0:18086",
      "--disable-rpc-ban",
      "--confirm-external-bind",
      "--confirm-zmq-rpc-external-bind",
      "--add-exclusive-node=node_1:48080",
      "--regtest",
      "--hide-my-port",
      "--max-connections-per-ip=100",
      "--non-interactive"
    ]
    volumes:
      - xmr_node_2_data:/data
    ports:
      - "18080:18080"
      - "18081:18081"
      - "18085:18085"
      - "18086:18086"
    depends_on:
      - node_1
    restart: on-failure

volumes:
  xmr_node_1_data:
  xmr_node_2_data:
